name: Compile Birdcam

on:
  push:
    branches: [main, wav-recording]
    paths:
      - birdcam.yaml
      - components/**
      - fonts/**
      - .github/workflows/firmware.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned ESPHome
        run: |
          python3 -m venv /tmp/birdcam-ci
          /tmp/birdcam-ci/bin/python -m pip install esphome==2026.9.1
      - name: Create test-only secrets
        run: |
          /tmp/birdcam-ci/bin/python - <<'PY'
          from pathlib import Path
          Path('secrets.yaml').write_text(
              'wifi_ssid: "birdcam-ci-example"\n'
              'wifi_password: "test-only-password"\n'
              'birdcam_api_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="\n'
              'birdcam_ap_password: "test-only-ap-password"\n'
          )
          PY
      - name: Compile complete firmware
        run: /tmp/birdcam-ci/bin/python -m esphome compile birdcam.yaml
